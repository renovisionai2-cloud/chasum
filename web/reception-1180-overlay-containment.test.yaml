fileType: momentic/test/v2
id: reception-1180-overlay-containment
name: Reception 1180 overlay containment
browserType: Google Chrome
viewport:
  width: 1180
  height: 820
steps:
  - navigate:
      url: /dashboard/calendar
      comment: Requires authenticated HQ access supplied at runtime via BASE_URL. Do not embed credentials or Vercel bypass secrets.
  - javascript:
      code: |
        const openBtn = document.querySelector('[aria-label="Open reception panel"]');
        if (openBtn) openBtn.click();
        const html = document.documentElement;
        if (html.scrollWidth > html.clientWidth) {
          throw new Error("document overflow " + html.scrollWidth + " > " + html.clientWidth);
        }
        const panel = document.querySelector('[data-testid="reception-panel"]');
        if (panel) {
          const mode = panel.getAttribute("data-layout-mode");
          const r = panel.getBoundingClientRect();
          if (mode !== "overlay") throw new Error("expected overlay at 1180, got " + mode);
          if (Math.round(r.width) !== 480) throw new Error("expected 480px panel, got " + Math.round(r.width));
          if (Math.round(r.right) > html.clientWidth + 1) throw new Error("panel exceeds viewport");
        }
      comment: True 1180 viewport must stay overlay and keep document width at 1180.
