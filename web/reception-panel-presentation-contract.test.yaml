fileType: momentic/test/v2
id: reception-panel-presentation-contract
name: Reception panel presentation contract
browserType: Google Chrome
viewport:
  width: 1024
  height: 768
steps:
  - navigate:
      url: /dashboard/calendar
      comment: Requires authenticated HQ access supplied at runtime via BASE_URL. Do not embed credentials or Vercel bypass secrets.
  - javascript:
      code: |
        const openBtn = document.querySelector('[aria-label="Open reception panel"]');
        if (openBtn) openBtn.click();
        const html = document.documentElement;
        if (html.scrollWidth > html.clientWidth) {
          throw new Error("document overflow " + html.scrollWidth + " > " + html.clientWidth);
        }
        const panel = document.querySelector('[data-testid="reception-panel"]');
        const slot = document.querySelector('[data-testid="reception-flex-slot"]');
        if (!panel) throw new Error("reception panel missing");
        const mode = panel.getAttribute("data-layout-mode");
        const occupies = slot && slot.getAttribute("data-occupies-flex");
        const widthAttr = panel.getAttribute("data-panel-width");
        const r = panel.getBoundingClientRect();
        if (widthAttr !== "480") throw new Error("expected data-panel-width 480");
        if (Math.round(r.width) !== 480) throw new Error("expected 480px bounding width");
        if (window.innerWidth <= 1180) {
          if (mode !== "overlay") throw new Error("expected overlay, got " + mode);
          if (occupies === "true") throw new Error("overlay must not occupy flex width");
        }
        const expandBtn = [...document.querySelectorAll("button")].some((b) => /^(Expand|Wide)$/.test((b.innerText || "").trim()));
        if (expandBtn) throw new Error("Expand control must not be present");
      comment: Overlay contract at 1024 — 480px panel, no flex occupancy, no Expand/Wide.
