# Supplementary execution evidence only; never the required branch check "quality".
# Local authoring does not establish Linux containment. Future dispatch requires
# separate PO approval of the exact control revision and independent delta audit.
# Isolation precedent: reviewed Decision B controls; no driver/candidate reuse.
# Docker semantics: https://docs.docker.com/engine/network/drivers/none/
name: GVM N02 exact-source Quality proof
on:
  workflow_dispatch:
    inputs:
      approved_control_sha:
        description: Independently reviewed exact control SHA approved for this execution
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: gvm-n02-exact-source-proof
  cancel-in-progress: false
jobs:
  n02-exact-source-proof:
    name: n02-exact-source-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      APPROVED_CONTROL_SHA: ${{ inputs.approved_control_sha }}
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
      PROOF_CHECK_RUN_ID: ${{ job.check_run_id }}
    steps:
      - name: Require reviewed control revision
        run: |
          set -euo pipefail
          python3 -I - <<'GUARD'
          import os,re
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='renovisionai2-cloud/chasum'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch'
          assert e['GITHUB_REF']=='refs/heads/main'
          assert re.fullmatch('[0-9a-f]{40}',e['APPROVED_CONTROL_SHA'])
          assert e['GITHUB_SHA']==e['TRUSTED_WORKFLOW_SHA']==e['APPROVED_CONTROL_SHA']
          assert e['TRUSTED_WORKFLOW_REF']=='renovisionai2-cloud/chasum/.github/workflows/gvm-n02-exact-source-quality-proof.yml@refs/heads/main'
          assert e['GITHUB_RUN_ATTEMPT']=='1'
          assert e['RUNNER_OS']=='Linux' and e['RUNNER_ENVIRONMENT']=='github-hosted'
          GUARD
      - name: Checkout reviewed controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - name: Checkout literal audited application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 89f801b7974f1c8348909b06ae326e6d72c56bb4
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node 22 without shared caches
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Execute isolated exact-source proof
        id: proof
        run: |
          set -euo pipefail
          umask 022
          cat > "$RUNNER_TEMP/n02-controller.py" <<'N02_CONTROLLER'
          """N02-only trusted controller. Linux execution is deliberately separate from offline tests.

          Networked acquisition executes pinned tooling, never application/lifecycle scripts.
          Every candidate-controlled phase executes in an unprivileged network-none container.
          The image and font data are architectural inputs from the reviewed Decision B controls;
          no Decision B driver, candidate, test scope or authorization is reused.
          """
          import copy, errno, hashlib, http.server, json, os, pathlib, platform, re
          import shutil, socket, subprocess, sys, tarfile, threading, time, urllib.request

          SHA = '89f801b7974f1c8348909b06ae326e6d72c56bb4'
          TREE = 'df59a150ac2a44e9f6bd54564ec9756d40503e1e'
          PARENT = 'b39b2e7ba579e58e0865c139ca1f2ee503c0e8ac'
          REPO = 'renovisionai2-cloud/chasum'
          WF = '.github/workflows/gvm-n02-exact-source-quality-proof.yml'
